name: 功能建议
description: 提出新功能、改进现有行为或优化体验的建议（非缺陷报告）。
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 提交前请先确认

        - 已经搜索过 [现有 Issues](https://github.com/shuaihaoV/ai-search-platform/issues?q=is%3Aissue)，没有相同建议。
        - 已经查看 [README 的功能特性与已知限制](https://github.com/shuaihaoV/ai-search-platform/blob/main/README.md)。
        - 本项目的定位是「单二进制、4+2 个环境变量、无数据库」的轻量搜索平台，
          与定位冲突的重型特性（如引入数据库/Redis/多用户体系）可能不会被接受。

  - type: checkboxes
    id: prechecks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issues，确认这不是重复建议
          required: true
        - label: 这不是安全漏洞报告（若是，我会改用 Security Advisory 私密报告）
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      description: 该建议主要影响哪一部分？
      options:
        - 后端 API / 缓存 / 上游请求（src/）
        - 前端界面与交互（frontend/）
        - 访问密码与鉴权（PLATFORM_PASSWD）
        - Docker / 部署与运维
        - 文档（README / docs/）
        - 构建、CI 或发布流程
        - 其它 / 不确定
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述你遇到的真实场景或痛点，而不是直接给方案。好的建议通常从一个具体问题出发。
      placeholder: |
        我在……场景下需要……，目前只能……，这导致……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？如有 API / UI 形态想法请具体写出。
      placeholder: 期望的行为、接口形态、界面草图或交互流程
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其它做法，或当前可用的替代手段（绕过方案、脚本、外部工具等）。
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: 影响面与兼容性
      description: |
        该改动是否会影响现有 API 契约、缓存键、环境变量、Docker 镜像或数据格式？
        是否可能破坏向后兼容？
      placeholder: 例如：新增可选环境变量（默认行为不变）、修改 /api/search 响应字段（破坏性）等
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 参考实现、相关 Issue/PR、截图或链接
    validations:
      required: false
