# =============================================================================
# Dependabot：定期更新依赖与 Actions 版本
# =============================================================================
version: 2
updates:
  # Rust 依赖
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(cargo)"
    groups:
      cargo-dependencies:
        patterns: ["*"]

  # 前端依赖
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(frontend)"
    groups:
      npm-dependencies:
        patterns: ["*"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
    ignore:
      # `dtolnay/rust-toolchain@<x>` 的 `@` 后面是 **Rust 工具链版本**，
      # 不是 action 自身的版本。Dependabot 会误以为它是版本号并尝试升级
      # （例如 1.88.0 -> 1.120.0），导致 CI 去安装一个不存在的工具链。
      # 工具链版本由我们按 MSRV 策略手动维护（见 ci.yml）。
      - dependency-name: "dtolnay/rust-toolchain"

  # Dockerfile 基础镜像
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker)"
