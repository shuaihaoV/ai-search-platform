# =============================================================================
# 持续集成：Rust（fmt / clippy / test / MSRV）与前端（typecheck / test / build）
#
# 触发：push 到 main、PR、手动触发。
# 不推送任何制品，仅做质量门禁；Docker 镜像构建见 docker.yml。
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# CI 只需要读取仓库
permissions:
  contents: read

# 同一分支/PR 的旧构建自动取消，节省 CI 时间
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"
  PNPM_VERSION: "11.22.0"

jobs:
  # ---------------------------------------------------------------------------
  # Rust：格式、clippy（warnings 视为错误）、单元/集成测试
  # 工具链固定为 1.97.1（与 Dockerfile 中的 1.88 同为 >= rust-version 1.88）
  # ---------------------------------------------------------------------------
  rust:
    name: Rust（fmt / clippy / test）
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Install system build deps（aws-lc-rs 需要 cmake）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: lint-test

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy（-D warnings）
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked --all-targets

  # ---------------------------------------------------------------------------
  # MSRV 门禁：Cargo.toml 声明 rust-version = "1.88"，这里用 1.88.0 实际验证
  # ---------------------------------------------------------------------------
  rust-msrv:
    name: Rust MSRV（1.88.0）
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88.0（MSRV）
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install system build deps（aws-lc-rs 需要 cmake）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: cargo check（MSRV）
        run: cargo check --locked

  # ---------------------------------------------------------------------------
  # 前端：类型检查、单元测试、生产构建
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend（typecheck / test / build）
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies（frozen lockfile）
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test -- --run

      - name: Build
        run: pnpm build

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
